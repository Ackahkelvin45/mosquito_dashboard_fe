# Frontend test stack — independent of the backend's docker-compose.test.yml.
# Talks to the API over its public HTTPS URL (NEXT_PUBLIC_BACKEND_API_URL in
# .env.test), not the docker network, so the two repos don't need to be
# siblings or share a compose project.
#   docker compose -f docker-compose.test.yml up -d --build
name: mosquito-test-frontend

services:
  frontend:
    build:
      context: .
      args:
        ENV_FILE: .env.test
    ports:
      - "3001:3000"
